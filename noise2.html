<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>White Noise Generator</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(180deg,#0f172a,#1e293b);
    color:white;
}

.container{
    max-width:520px;
    margin:0 auto;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:24px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

button{
    width:100%;
    border:none;
    border-radius:16px;
    padding:18px;
    font-size:20px;
    font-weight:700;
    background:#2563eb;
    color:white;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(0.98);
}

label{
    display:block;
    margin-top:22px;
    margin-bottom:8px;
    font-size:15px;
}

select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    font-size:17px;
}

input[type="range"]{
    width:100%;
    height:48px;
    touch-action:pan-y;
}

.value{
    text-align:right;
    font-size:14px;
    opacity:.8;
}
</style>
</head>
<body>

<div class="container">
    <h1>🎧 White Noise</h1>

    <div class="card">

        <button id="toggleBtn">Włącz szum</button>

        <label>Rodzaj szumu</label>
        <select id="noiseType">
            <option value="white">Biały</option>
            <option value="pink">Różowy</option>
            <option value="brown">Brązowy</option>
        </select>

        <label>Głośność</label>
        <input type="range" id="volume" min="0" max="100" value="40">
        <div class="value"><span id="volumeVal">40</span>%</div>

        <label>Niskie tony</label>
        <input type="range" id="bass" min="-30" max="30" value="0">
        <div class="value"><span id="bassVal">0</span>dB</div>

        <label>Wysokie tony</label>
        <input type="range" id="treble" min="-30" max="30" value="0">
        <div class="value"><span id="trebleVal">0</span>dB</div>

    </div>
</div>

<script>

let audioCtx = null;
let source = null;
let gainNode = null;
let bassFilter = null;
let trebleFilter = null;
let playing = false;

const btn = document.getElementById('toggleBtn');

async function ensureAudioContext() {

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state !== 'running') {
        await audioCtx.resume();
    }
}

function createNoiseBuffer(type){

    const length = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    if(type === 'white'){
        for(let i=0;i<length;i++){
            data[i] = Math.random()*2 - 1;
        }
    }

    if(type === 'pink'){
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;

        for(let i=0;i<length;i++){
            let white=Math.random()*2-1;
            b0=0.99886*b0 + white*0.0555179;
            b1=0.99332*b1 + white*0.0750759;
            b2=0.96900*b2 + white*0.1538520;
            b3=0.86650*b3 + white*0.3104856;
            b4=0.55000*b4 + white*0.5329522;
            b5=-0.7616*b5 - white*0.0168980;

            data[i]=b0+b1+b2+b3+b4+b5+b6+white*0.5362;
            data[i]*=0.11;
            b6=white*0.115926;
        }
    }

    if(type === 'brown'){
        let lastOut = 0;

        for(let i=0;i<length;i++){
            let white = Math.random()*2-1;
            data[i] = (lastOut + (0.02*white))/1.02;
            lastOut = data[i];
            data[i] *= 3.5;
        }
    }

    return buffer;
}

function updateControls(){

    document.getElementById('volumeVal').textContent =
        volume.value;

    document.getElementById('bassVal').textContent =
        bass.value;

    document.getElementById('trebleVal').textContent =
        treble.value;

    if(!gainNode) return;

    gainNode.gain.value = volume.value/100;
    bassFilter.gain.value = bass.value;
    trebleFilter.gain.value = treble.value;
}

async function startNoise(){

    await ensureAudioContext();

    gainNode = audioCtx.createGain();

    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = "lowshelf";
    bassFilter.frequency.value = 250;

    trebleFilter = audioCtx.createBiquadFilter();
    trebleFilter.type = "highshelf";
    trebleFilter.frequency.value = 3500;

    source = audioCtx.createBufferSource();
    source.buffer = createNoiseBuffer(noiseType.value);
    source.loop = true;

    source.connect(bassFilter);
    bassFilter.connect(trebleFilter);
    trebleFilter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    updateControls();

    source.start(0);

    playing = true;
    btn.textContent = "Wyłącz szum";
}

function stopNoise(){

    if(source){
        source.stop();
        source.disconnect();
        source = null;
    }

    playing = false;
    btn.textContent = "Włącz szum";
}

btn.addEventListener('touchend', async function(e){
    e.preventDefault();

    if(!playing){
        await startNoise();
    }else{
        stopNoise();
    }
});

btn.addEventListener('click', async function(){

    if(!playing){
        await startNoise();
    }else{
        stopNoise();
    }
});

volume.addEventListener('input', updateControls);
bass.addEventListener('input', updateControls);
treble.addEventListener('input', updateControls);

noiseType.addEventListener('change', async ()=>{

    if(playing){
        stopNoise();
        await startNoise();
    }
});

updateControls();

</script>

</body>
</html>
