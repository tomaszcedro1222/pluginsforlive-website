<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINK VISUALS — Little Life Simulator</title>
  <meta name="description" content="Mały całodobowy symulator życia ludka LINK VISUALS reagujący na prawdziwą pogodę." />
  <style>
    :root {
      --sky-day-1: #83d7ff;
      --sky-day-2: #eaf8ff;
      --sky-night-1: #071324;
      --sky-night-2: #10284a;
      --ground: #17202b;
      --window: #ffe38a;
      --building: #18283b;
      --building-2: #243a55;
      --accent: #f5f7fb;
      --brand: #ffffff;
      --shadow: rgba(0,0,0,.25);
      --rain: rgba(210,235,255,.75);
      --sun: #ffd45a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #06111f;
      color: white;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 16%, rgba(255,255,255,.45), transparent 7rem),
        linear-gradient(var(--sky-day-1), var(--sky-day-2) 58%, #accbaf 58%, #5b785f 100%);
      transition: background 1.2s ease;
    }

    .scene.night {
      background:
        radial-gradient(circle at 78% 14%, rgba(255,255,255,.95), rgba(255,255,255,.4) 2.2rem, transparent 2.4rem),
        linear-gradient(var(--sky-night-1), var(--sky-night-2) 60%, #17212c 60%, #0f171e 100%);
    }

    .scene.rainy::before {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(110deg, transparent 0 22px, var(--rain) 23px 25px, transparent 26px 36px);
      animation: rainFall .45s linear infinite;
      opacity: .72;
      z-index: 30;
    }

    .scene.rainy::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 42%;
      background: linear-gradient(transparent, rgba(80,130,160,.18));
      pointer-events: none;
      z-index: 28;
    }

    @keyframes rainFall {
      from { transform: translate3d(-40px,-40px,0); }
      to { transform: translate3d(40px,40px,0); }
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #fff 0 1px, transparent 1.5px);
      background-size: 180px 140px, 260px 210px, 340px 260px;
      background-position: 30px 20px, 120px 80px, 70px 160px;
    }

    .night .stars { opacity: .9; }

    .sunMoon {
      position: absolute;
      right: 10vw;
      top: 9vh;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 45px rgba(255,212,90,.75);
      transition: background 1s ease, box-shadow 1s ease;
      z-index: 2;
    }

    .night .sunMoon {
      background: #f4f1da;
      box-shadow: 0 0 24px rgba(255,255,255,.35);
    }

    .cloud {
      position: absolute;
      top: 13vh;
      left: -22vw;
      width: 180px;
      height: 52px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      filter: drop-shadow(0 9px 14px rgba(0,0,0,.12));
      animation: cloudMove 55s linear infinite;
      z-index: 4;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 82px;
      height: 82px;
      left: 28px;
      top: -38px;
    }

    .cloud::after {
      width: 104px;
      height: 104px;
      right: 20px;
      top: -55px;
    }

    .cloud.two {
      top: 24vh;
      animation-duration: 78s;
      animation-delay: -18s;
      transform: scale(.75);
      opacity: .8;
    }

    @keyframes cloudMove {
      from { left: -24vw; }
      to { left: 124vw; }
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 17vh;
      height: 42vh;
      display: flex;
      align-items: end;
      justify-content: space-around;
      padding: 0 4vw;
      z-index: 10;
    }

    .building {
      position: relative;
      width: min(8vw, 92px);
      min-width: 52px;
      height: calc(130px + var(--h) * 1px);
      border-radius: 10px 10px 0 0;
      background: linear-gradient(145deg, var(--building), var(--building-2));
      box-shadow: 0 24px 40px var(--shadow);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
    }

    .building .letter {
      font-size: clamp(26px, 5vw, 54px);
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--brand);
      text-shadow: 0 4px 12px rgba(0,0,0,.35);
    }

    .building::before {
      content: "";
      position: absolute;
      left: 13%;
      right: 13%;
      top: 18px;
      bottom: 18px;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0 20px,
          rgba(255,227,138,.72) 21px 31px,
          transparent 32px 45px);
      opacity: .35;
      border-radius: 6px;
    }

    .building .letter { z-index: 2; }

    .roofFlag {
      position: absolute;
      top: -46px;
      left: 50%;
      width: 2px;
      height: 46px;
      background: white;
      opacity: .6;
    }

    .roofFlag::after {
      content: "LV";
      position: absolute;
      top: 3px;
      left: 2px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,.9);
      color: #142033;
      border-radius: 0 8px 8px 0;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20vh;
      background:
        linear-gradient(rgba(255,255,255,.08), transparent 12%),
        repeating-linear-gradient(90deg, transparent 0 70px, rgba(255,255,255,.07) 71px 74px),
        var(--ground);
      z-index: 18;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      top: 22%;
      height: 42%;
      background: rgba(0,0,0,.25);
      border-top: 2px solid rgba(255,255,255,.15);
      border-bottom: 2px solid rgba(255,255,255,.15);
    }

    .road::after {
      content: "LINK VISUALS • LINK VISUALS • LINK VISUALS • LINK VISUALS • LINK VISUALS";
      position: absolute;
      left: 0;
      right: 0;
      top: 35%;
      font-size: clamp(16px, 2.6vw, 32px);
      font-weight: 900;
      letter-spacing: .25em;
      white-space: nowrap;
      opacity: .18;
      animation: brandScroll 26s linear infinite;
    }

    @keyframes brandScroll {
      from { transform: translateX(0); }
      to { transform: translateX(-520px); }
    }

    .walker {
      position: absolute;
      left: 0;
      bottom: 17vh;
      width: 68px;
      height: 118px;
      transform-origin: 50% 100%;
      z-index: 25;
      animation: travel 32s linear infinite, bob .6s ease-in-out infinite;
    }

    @keyframes travel {
      0%   { transform: translateX(-90px) translateY(0) scaleX(1); }
      16%  { transform: translateX(18vw) translateY(0) scaleX(1); }
      22%  { transform: translateX(25vw) translateY(-210px) scaleX(1); }
      28%  { transform: translateX(33vw) translateY(-210px) scaleX(1); }
      34%  { transform: translateX(42vw) translateY(0) scaleX(1); }
      54%  { transform: translateX(72vw) translateY(0) scaleX(1); }
      61%  { transform: translateX(79vw) translateY(-250px) scaleX(1); }
      68%  { transform: translateX(86vw) translateY(-250px) scaleX(1); }
      76%  { transform: translateX(97vw) translateY(0) scaleX(1); }
      84%  { transform: translateX(103vw) translateY(0) scaleX(-1); }
      100% { transform: translateX(-90px) translateY(0) scaleX(1); }
    }

    @keyframes bob {
      0%,100% { margin-bottom: 0; }
      50% { margin-bottom: 5px; }
    }

    .head {
      position: absolute;
      top: 0;
      left: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffd5ae;
      box-shadow: inset -7px -4px rgba(0,0,0,.08);
    }

    .hair {
      position: absolute;
      top: -4px;
      left: 17px;
      width: 36px;
      height: 18px;
      background: #25180e;
      border-radius: 18px 18px 8px 8px;
      transform: rotate(-5deg);
    }

    .eye {
      position: absolute;
      top: 13px;
      left: 25px;
      width: 5px;
      height: 5px;
      background: #142033;
      border-radius: 50%;
      box-shadow: 11px 0 #142033;
      animation: lookAtUser 7s ease-in-out infinite;
    }

    @keyframes lookAtUser {
      0%, 70%, 100% { transform: translateX(0); }
      78%, 90% { transform: translateX(3px) scale(1.15); }
    }

    .body {
      position: absolute;
      top: 38px;
      left: 18px;
      width: 34px;
      height: 42px;
      background: #f4f8ff;
      border-radius: 12px 12px 8px 8px;
      box-shadow: inset 0 -12px rgba(20,32,51,.12);
    }

    .body::after {
      content: "LV";
      position: absolute;
      inset: 8px 0 auto;
      text-align: center;
      color: #142033;
      font-size: 12px;
      font-weight: 900;
    }

    .arm, .leg {
      position: absolute;
      background: #ffd5ae;
      border-radius: 999px;
      transform-origin: top center;
    }

    .arm {
      top: 43px;
      width: 9px;
      height: 35px;
      animation: swingArm .6s ease-in-out infinite;
    }

    .arm.left { left: 9px; }
    .arm.right { right: 9px; animation-delay: -.3s; }

    @keyframes swingArm {
      0%,100% { transform: rotate(25deg); }
      50% { transform: rotate(-25deg); }
    }

    .leg {
      top: 78px;
      width: 10px;
      height: 41px;
      background: #111827;
      animation: swingLeg .6s ease-in-out infinite;
    }

    .leg.left { left: 21px; }
    .leg.right { right: 21px; animation-delay: -.3s; }

    @keyframes swingLeg {
      0%,100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    .umbrella {
      position: absolute;
      left: -13px;
      top: -44px;
      width: 94px;
      height: 50px;
      opacity: 0;
      transform: scale(.8);
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: none;
    }

    .rainy .umbrella {
      opacity: 1;
      transform: scale(1);
    }

    .umbrella::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 90px 90px 8px 8px;
      background:
        repeating-conic-gradient(from 0deg, #f04f63 0 25deg, #ffffff 25deg 50deg);
      clip-path: polygon(0 100%, 10% 35%, 50% 0, 90% 35%, 100% 100%);
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
    }

    .umbrella::after {
      content: "";
      position: absolute;
      left: 47px;
      top: 38px;
      width: 3px;
      height: 54px;
      background: #2a3342;
      border-radius: 999px;
    }

    .speech {
      position: absolute;
      left: 55px;
      top: -32px;
      min-width: 130px;
      padding: 8px 10px;
      border-radius: 14px 14px 14px 2px;
      background: rgba(255,255,255,.92);
      color: #142033;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(8px);
      animation: talk 11s ease-in-out infinite;
    }

    @keyframes talk {
      0%, 63%, 100% { opacity: 0; transform: translateY(8px); }
      70%, 90% { opacity: 1; transform: translateY(0); }
    }

    .hud {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 60;
      max-width: min(420px, calc(100vw - 36px));
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(8,18,31,.58);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.14);
    }

    .logo {
      font-size: 23px;
      font-weight: 950;
      letter-spacing: .18em;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      line-height: 1.45;
      opacity: .92;
    }

    .button {
      appearance: none;
      margin-top: 10px;
      border: 0;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #142033;
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover { background: white; }

    .marquee {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 3;
      white-space: nowrap;
      font-size: clamp(60px, 15vw, 210px);
      font-weight: 950;
      letter-spacing: .12em;
      color: rgba(255,255,255,.08);
      animation: bigBrand 70s linear infinite;
      pointer-events: none;
    }

    @keyframes bigBrand {
      from { transform: translateX(100vw); }
      to { transform: translateX(-220vw); }
    }

    @media (max-width: 760px) {
      .city { padding: 0 2vw; }
      .building { min-width: 34px; border-radius: 7px 7px 0 0; }
      .building .letter { font-size: 28px; }
      .hud { font-size: 12px; }
      .walker { transform: scale(.82); }
    }
  </style>
</head>
<body>
  <main id="scene" class="scene">
    <div class="stars"></div>
    <div class="sunMoon" aria-hidden="true"></div>
    <div class="cloud"></div>
    <div class="cloud two"></div>
    <div class="marquee">LINK VISUALS • LINK VISUALS • LINK VISUALS •</div>

    <section class="hud">
      <div class="logo">LINK VISUALS</div>
      <div id="status" class="status">Uruchamiam całodobowy symulator życia ludka…</div>
      <button id="locBtn" class="button">Użyj mojej lokalizacji</button>
    </section>

    <section class="city" aria-label="Budynki LINK VISUALS">
      <div class="building" style="--h:70"><span class="roofFlag"></span><span class="letter">L</span></div>
      <div class="building" style="--h:140"><span class="letter">I</span></div>
      <div class="building" style="--h:95"><span class="letter">N</span></div>
      <div class="building" style="--h:180"><span class="letter">K</span></div>
      <div class="building" style="--h:125"><span class="roofFlag"></span><span class="letter">V</span></div>
      <div class="building" style="--h:165"><span class="letter">I</span></div>
      <div class="building" style="--h:85"><span class="letter">S</span></div>
      <div class="building" style="--h:145"><span class="letter">U</span></div>
      <div class="building" style="--h:105"><span class="roofFlag"></span><span class="letter">A</span></div>
      <div class="building" style="--h:155"><span class="letter">L</span></div>
      <div class="building" style="--h:115"><span class="letter">S</span></div>
    </section>

    <div class="walker" aria-label="Ludek LINK VISUALS">
      <div class="umbrella"></div>
      <div class="speech" id="speech">Patrzę, czy oglądasz LINK VISUALS 👀</div>
      <div class="hair"></div>
      <div class="head"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div class="ground">
      <div class="road"></div>
    </div>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const statusEl = document.getElementById('status');
    const locBtn = document.getElementById('locBtn');
    const speech = document.getElementById('speech');

    const fallback = {
      latitude: 52.2297,
      longitude: 21.0122,
      label: 'Warszawa / lokalizacja domyślna'
    };

    const weatherText = {
      0: 'bezchmurnie',
      1: 'przeważnie pogodnie',
      2: 'częściowe zachmurzenie',
      3: 'pochmurno',
      45: 'mgła',
      48: 'mgła osadzająca szadź',
      51: 'lekka mżawka',
      53: 'mżawka',
      55: 'mocna mżawka',
      56: 'marznąca mżawka',
      57: 'mocna marznąca mżawka',
      61: 'lekki deszcz',
      63: 'deszcz',
      65: 'mocny deszcz',
      66: 'marznący deszcz',
      67: 'mocny marznący deszcz',
      71: 'lekki śnieg',
      73: 'śnieg',
      75: 'mocny śnieg',
      77: 'ziarna śniegu',
      80: 'przelotny deszcz',
      81: 'mocniejszy przelotny deszcz',
      82: 'ulewa',
      85: 'przelotny śnieg',
      86: 'mocny przelotny śnieg',
      95: 'burza',
      96: 'burza z gradem',
      99: 'mocna burza z gradem'
    };

    function isRain(code) {
      return [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(Number(code));
    }

    function updateDayNight() {
      const hour = new Date().getHours();
      const night = hour < 6 || hour >= 20;
      scene.classList.toggle('night', night);
      return night;
    }

    function applyWeather(data, label) {
      const current = data.current || {};
      const code = current.weather_code;
      const raining = isRain(code);
      const night = updateDayNight();

      scene.classList.toggle('rainy', raining);

      const temp = Math.round(current.temperature_2m ?? 0);
      const wind = Math.round(current.wind_speed_10m ?? 0);
      const desc = weatherText[code] || 'pogoda nieznana';

      statusEl.innerHTML =
        `Lokalizacja: <b>${label}</b><br>` +
        `Na zewnątrz: <b>${desc}</b>, ${temp}°C, wiatr ${wind} km/h.<br>` +
        `Tryb: <b>${night ? 'noc' : 'dzień'}</b>. Ludek działa 24/7 i pilnuje brandu LINK VISUALS.`;

      speech.textContent = raining
        ? 'Pada, więc otwieram parasol LINK VISUALS ☔'
        : night
          ? 'Nocna zmiana LINK VISUALS 🌙'
          : 'Idę do kolejnego budynku LINK VISUALS ☀️';
    }

    async function fetchWeather(place = fallback) {
      statusEl.textContent = 'Pobieram prawdziwą pogodę z zewnątrz…';

      const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Błąd pobierania pogody');
        const data = await response.json();
        applyWeather(data, place.label);
      } catch (error) {
        updateDayNight();
        scene.classList.remove('rainy');
        statusEl.innerHTML =
          `Nie udało się pobrać pogody, więc symulator działa w trybie awaryjnym.<br>` +
          `Budynki LINK VISUALS i ludek nadal działają 24/7.`;
        speech.textContent = 'Tryb offline, ale LINK VISUALS żyje dalej.';
      }
    }

    function useBrowserLocation() {
      if (!navigator.geolocation) {
        fetchWeather(fallback);
        return;
      }

      statusEl.textContent = 'Czekam na zgodę przeglądarki na lokalizację…';

      navigator.geolocation.getCurrentPosition(
        position => {
          fetchWeather({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            label: 'Twoja lokalizacja'
          });
        },
        () => fetchWeather(fallback),
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 20 * 60 * 1000 }
      );
    }

    locBtn.addEventListener('click', useBrowserLocation);

    updateDayNight();
    fetchWeather(fallback);

    setInterval(updateDayNight, 60 * 1000);
    setInterval(() => fetchWeather(fallback), 10 * 60 * 1000);

    const phrases = [
      'Sprawdzam dach budynku LINK VISUALS.',
      'Czy użytkownik dalej patrzy? 👀',
      'Idę przez miasto z liter LINK VISUALS.',
      'Mały dzień pracy, duży brand.',
      'LINK VISUALS nadaje 24/7.'
    ];

    setInterval(() => {
      if (!scene.classList.contains('rainy')) {
        speech.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      }
    }, 11000);
  </script>
</body>
</html>
