<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINK VISUALS — Studio Life</title>
  <meta name="description" content="Animowane studio LINK VISUALS z ludkiem, pogodą, światłem, kamerami i ekranem produkcyjnym." />
  <style>
    :root {
      --bg1: #11151c;
      --bg2: #222833;
      --wood: #b9874e;
      --red: #ff3148;
      --warm: #ffc56f;
      --cold: #cce7ff;
      --screenGlow: rgba(255,49,72,.32);
      --weatherTint: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    .studio {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
      background:
        radial-gradient(circle at 14% 22%, rgba(255,49,72,.14), transparent 20%),
        radial-gradient(circle at 86% 22%, rgba(255,49,72,.16), transparent 21%),
        radial-gradient(circle at 52% 12%, rgba(255,197,111,.16), transparent 32%),
        linear-gradient(145deg, var(--bg1), var(--bg2) 60%, #111 100%);
      transition: filter .8s ease, background 1s ease;
    }

    .studio.night {
      filter: brightness(.78) contrast(1.08);
    }

    .studio.rainy {
      background:
        radial-gradient(circle at 14% 22%, rgba(89,148,255,.14), transparent 20%),
        radial-gradient(circle at 86% 22%, rgba(89,148,255,.15), transparent 21%),
        radial-gradient(circle at 52% 12%, rgba(200,230,255,.12), transparent 32%),
        linear-gradient(145deg, #0b111b, #172334 60%, #0b0d12 100%);
    }

    .studio.rainy::after {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(110deg, transparent 0 24px, rgba(210,235,255,.34) 25px 27px, transparent 28px 40px);
      animation: rainFall .6s linear infinite;
      opacity: .62;
      z-index: 80;
    }

    @keyframes rainFall {
      from { transform: translate3d(-30px,-30px,0); }
      to { transform: translate3d(30px,30px,0); }
    }

    .weatherBox {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 120;
      min-width: 175px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(4,8,14,.58);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.14);
      pointer-events: none;
    }

    .weatherBox .logo {
      font-size: 19px;
      font-weight: 950;
      letter-spacing: .18em;
      margin-bottom: 7px;
    }

    .weatherText {
      font-size: 14px;
      line-height: 1.45;
      opacity: .95;
    }

    .fullscreenBtn {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 130;
      border: 1px solid rgba(255,255,255,.18);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(4,8,14,.62);
      color: white;
      font-size: 13px;
      font-weight: 900;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,.24);
      cursor: pointer;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .45s ease, transform .45s ease;
    }

    .fullscreenBtn.hidden {
      opacity: 0;
      transform: translateY(-16px);
      pointer-events: none;
    }

    .backWall {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 76vh;
      z-index: 1;
      background:
        linear-gradient(90deg, transparent 0 30%, rgba(0,0,0,.22) 30% 70%, transparent 70%),
        linear-gradient(to bottom, rgba(255,255,255,.05), transparent);
    }

    .slats {
      position: absolute;
      left: 35%;
      top: 5vh;
      width: 30%;
      height: 56vh;
      border-radius: 14px;
      background:
        repeating-linear-gradient(90deg,
          #1b1510 0 10px,
          var(--wood) 11px 17px,
          #1b1510 18px 30px);
      box-shadow:
        inset 0 0 50px rgba(255,190,100,.14),
        0 35px 70px rgba(0,0,0,.35);
      z-index: 2;
    }

    .slats::before,
    .slats::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(var(--warm), transparent 45%, var(--warm));
      opacity: .9;
      filter: blur(.5px);
      animation: tubeGlow 5s ease-in-out infinite;
    }

    .slats::before { left: 22%; }
    .slats::after { right: 24%; animation-delay: -2.3s; }

    @keyframes tubeGlow {
      0%,100% { opacity: .35; }
      50% { opacity: .95; }
    }

    .shelf {
      position: absolute;
      top: 13vh;
      width: 22vw;
      height: 38vh;
      z-index: 3;
      border-top: 5px solid rgba(255,255,255,.16);
      border-bottom: 5px solid rgba(255,255,255,.12);
      background:
        linear-gradient(to bottom, transparent 0 32%, rgba(255,255,255,.12) 33% 35%, transparent 36% 66%, rgba(255,255,255,.12) 67% 69%, transparent 70%),
        rgba(0,0,0,.14);
    }

    .shelf.left { left: 7vw; }
    .shelf.right { right: 7vw; }

    .shelf::before {
      content: "";
      position: absolute;
      inset: 8%;
      background:
        radial-gradient(circle at 14% 18%, #7fc779 0 5%, transparent 6%),
        linear-gradient(90deg, transparent 0 8%, #d4c5aa 8% 13%, transparent 13% 19%, #444b57 19% 24%, transparent 24% 31%, #b18754 31% 35%, transparent 35%),
        radial-gradient(circle at 80% 66%, #7fc779 0 7%, transparent 8%);
      opacity: .75;
    }

    .neon {
      position: absolute;
      z-index: 5;
      padding: 8px 18px;
      border: 2px solid var(--red);
      border-radius: 8px;
      color: #fff;
      font-weight: 950;
      letter-spacing: .08em;
      text-shadow: 0 0 12px var(--red);
      box-shadow: 0 0 20px rgba(255,49,72,.45), inset 0 0 18px rgba(255,49,72,.2);
      animation: neonPulse 3.4s ease-in-out infinite;
    }

    .neon.rec { left: 5vw; top: 32vh; }
    .neon.air { right: 8vw; top: 32vh; }

    @keyframes neonPulse {
      0%,100% { opacity: .75; }
      50% { opacity: 1; }
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 16vh;
      width: min(34vw, 520px);
      height: min(22vw, 310px);
      min-width: 340px;
      min-height: 190px;
      transform: translateX(-50%);
      z-index: 10;
      border: 8px solid #05070a;
      border-radius: 10px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,49,72,.15), transparent 62%),
        linear-gradient(180deg, #06080d, #121722);
      box-shadow:
        0 0 42px var(--screenGlow),
        0 35px 70px rgba(0,0,0,.5);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255,49,72,.35), transparent),
        repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,255,255,.03) 9px 10px);
      opacity: .5;
      animation: screenWave 8s linear infinite;
    }

    @keyframes screenWave {
      from { transform: translateX(-45%); }
      to { transform: translateX(45%); }
    }

    .screenContent {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    .screenTitle {
      font-size: clamp(28px, 4vw, 58px);
      font-weight: 950;
      letter-spacing: .11em;
      line-height: .95;
    }

    .screenSub {
      margin-top: 12px;
      font-size: clamp(11px, 1.3vw, 17px);
      font-weight: 850;
      letter-spacing: .15em;
      opacity: .9;
    }

    .screenBadge {
      display: inline-block;
      margin-top: 16px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--red);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .09em;
    }

    .screenRec {
      position: absolute;
      right: 20px;
      top: 16px;
      z-index: 3;
      font-size: 14px;
      font-weight: 950;
      color: #ff3048;
    }

    .screenRec::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: #ff3048;
      box-shadow: 0 0 12px #ff3048;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 50% { opacity: .25; } }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36vh;
      z-index: 20;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,.11), transparent 52%),
        linear-gradient(160deg, #161616, #24211f 48%, #101010);
      box-shadow: inset 0 26px 42px rgba(0,0,0,.35);
    }

    .rug {
      position: absolute;
      left: 50%;
      bottom: 9vh;
      width: min(44vw, 650px);
      height: 17vh;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,.11), transparent 65%),
        repeating-radial-gradient(ellipse at center, #3a3a3a 0 3px, #303030 4px 7px);
      z-index: 22;
      opacity: .85;
    }

    .chair {
      position: absolute;
      bottom: 18vh;
      width: 16vw;
      min-width: 160px;
      height: 20vh;
      z-index: 24;
    }

    .chair.left { left: 28vw; transform: translateX(-50%); }
    .chair.right { right: 28vw; transform: translateX(50%) scaleX(-1); }

    .chair .seat {
      position: absolute;
      bottom: 0;
      left: 8%;
      right: 8%;
      height: 44%;
      border-radius: 30px 30px 14px 14px;
      background: linear-gradient(145deg, #8a8580, #5f6067);
      box-shadow: 0 24px 28px rgba(0,0,0,.34);
    }

    .chair .back {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 30%;
      height: 68%;
      border-radius: 34px 34px 16px 16px;
      background: linear-gradient(145deg, #9d9892, #686a72);
      box-shadow: inset -16px -10px rgba(0,0,0,.08);
    }

    .chair .leg {
      position: absolute;
      bottom: -30px;
      width: 6px;
      height: 34px;
      background: #111;
      border-radius: 999px;
    }

    .chair .leg.one { left: 26%; }
    .chair .leg.two { right: 26%; }

    .table {
      position: absolute;
      left: 50%;
      bottom: 15vh;
      width: 130px;
      height: 70px;
      transform: translateX(-50%);
      z-index: 27;
      border-radius: 50%;
      background: linear-gradient(#111, #050505);
      box-shadow: 0 24px 26px rgba(0,0,0,.42);
    }

    .glass {
      position: absolute;
      top: -20px;
      width: 18px;
      height: 32px;
      border: 2px solid rgba(255,255,255,.7);
      border-radius: 3px 3px 8px 8px;
      background: rgba(255,255,255,.1);
    }

    .glass.one { left: 30px; }
    .glass.two { right: 30px; }

    .mic {
      position: absolute;
      bottom: 30vh;
      z-index: 35;
      width: 80px;
      height: 70px;
    }

    .mic.left { left: 35vw; transform: rotate(-16deg); }
    .mic.right { right: 35vw; transform: rotate(16deg) scaleX(-1); }

    .mic::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 28px;
      width: 60px;
      height: 6px;
      border-radius: 999px;
      background: #101010;
      transform: rotate(-20deg);
      transform-origin: left center;
    }

    .mic::after {
      content: "";
      position: absolute;
      right: 0;
      top: 12px;
      width: 20px;
      height: 34px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(0deg, #111 0 4px, #333 5px 7px);
      box-shadow: 0 8px 14px rgba(0,0,0,.35);
    }

    .camera {
      position: absolute;
      z-index: 36;
      width: 140px;
      height: 130px;
      bottom: 18vh;
      filter: drop-shadow(0 20px 20px rgba(0,0,0,.45));
    }

    .camera.left { left: 3vw; transform: scale(1.25); }
    .camera.right { right: 6vw; }

    .camBody {
      position: absolute;
      top: 16px;
      left: 28px;
      width: 76px;
      height: 44px;
      border-radius: 8px;
      background: linear-gradient(145deg, #1e2732, #06080d);
      border: 1px solid rgba(255,255,255,.18);
    }

    .camBody::after {
      content: "LV";
      position: absolute;
      left: 12px;
      top: 13px;
      font-weight: 950;
      font-size: 14px;
      letter-spacing: .1em;
      opacity: .85;
    }

    .lens {
      position: absolute;
      top: 20px;
      left: 0;
      width: 42px;
      height: 36px;
      border-radius: 16px 4px 4px 16px;
      background:
        radial-gradient(circle at 25% 50%, #23384d, #05070a 55%);
      border: 3px solid #0b0b0b;
    }

    .tripod {
      position: absolute;
      top: 58px;
      left: 64px;
      width: 6px;
      height: 72px;
      background: #070707;
      border-radius: 999px;
    }

    .tripod::before,
    .tripod::after {
      content: "";
      position: absolute;
      top: 35px;
      width: 6px;
      height: 72px;
      background: #070707;
      border-radius: 999px;
      transform-origin: top center;
    }

    .tripod::before { transform: rotate(24deg); }
    .tripod::after { transform: rotate(-24deg); }

    .softbox {
      position: absolute;
      z-index: 34;
      width: 190px;
      height: 150px;
      filter: drop-shadow(0 20px 20px rgba(0,0,0,.45));
    }

    .softbox.left {
      left: 8vw;
      top: 5vh;
      transform: rotate(18deg);
    }

    .softbox.right {
      right: 5vw;
      top: 4vh;
      transform: rotate(-20deg) scaleX(-1);
    }

    .softbox .head {
      position: absolute;
      width: 120px;
      height: 64px;
      border-radius: 10px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.96) 0 35%, #111 36% 42%, rgba(255,255,255,.96) 43% 75%, #111 76%);
      box-shadow: 0 0 36px rgba(255,255,255,.38);
    }

    .softbox .stand {
      position: absolute;
      left: 82px;
      top: 56px;
      width: 5px;
      height: 120px;
      background: #070707;
      border-radius: 999px;
    }

    .case {
      position: absolute;
      bottom: 7vh;
      z-index: 28;
      width: 145px;
      height: 70px;
      border-radius: 8px;
      background: linear-gradient(145deg, #2b2b2b, #070707);
      border: 2px solid rgba(255,255,255,.26);
      box-shadow: 0 18px 22px rgba(0,0,0,.4);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: .14em;
      color: rgba(255,255,255,.8);
    }

    .case.lights { left: 24vw; }
    .case.microphones { right: 14vw; }

    .statusBoard {
      display: none;
    }

    .worker {
      position: absolute;
      left: 0;
      bottom: 14vh;
      width: 70px;
      height: 126px;
      z-index: 60;
      transform-origin: 50% 100%;
      animation: walkStudio 32s linear infinite, bob .6s ease-in-out infinite;
      transition: left .8s ease, bottom .8s ease, transform .8s ease;
    }

    .worker.close {
      animation: none;
      left: calc(50vw - 35px);
      bottom: 9vh;
      transform: scale(2.25);
      z-index: 100;
    }

    .worker.picnic {
      animation: picnicSpot 15s ease-in-out forwards, bob 1.1s ease-in-out infinite;
    }

    .worker.adjustCamera {
      animation: adjustCamera 9s ease-in-out forwards;
    }

    .worker.adjustLight {
      animation: adjustLight 9s ease-in-out forwards;
    }

    .worker.carryCase {
      animation: carryCase 12s linear forwards, bob .6s ease-in-out infinite;
    }

    @keyframes walkStudio {
      0% { transform: translateX(-90px) scaleX(1); }
      18% { transform: translateX(20vw) scaleX(1); }
      33% { transform: translateX(38vw) scaleX(1); }
      46% { transform: translateX(48vw) translateY(-40px) scaleX(1); }
      58% { transform: translateX(58vw) scaleX(1); }
      76% { transform: translateX(82vw) scaleX(1); }
      86% { transform: translateX(96vw) scaleX(-1); }
      100% { transform: translateX(-90px) scaleX(1); }
    }

    @keyframes picnicSpot {
      from { left: 0; transform: translateX(0); }
      to { left: 52vw; transform: translateX(-50%); }
    }

    @keyframes adjustCamera {
      from { left: 0; transform: translateX(-90px); }
      60%,100% { left: 80vw; transform: translateX(-50%); }
    }

    @keyframes adjustLight {
      from { left: 0; transform: translateX(-90px); }
      60%,100% { left: 13vw; bottom: 32vh; transform: translateX(-50%); }
    }

    @keyframes carryCase {
      from { transform: translateX(-90px) scaleX(1); }
      to { transform: translateX(105vw) scaleX(1); }
    }

    @keyframes bob {
      0%,100% { margin-bottom: 0; }
      50% { margin-bottom: 5px; }
    }

    .personHead {
      position: absolute;
      top: 0;
      left: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffd5ae;
      box-shadow: inset -7px -4px rgba(0,0,0,.08);
    }

    .hair {
      position: absolute;
      top: -4px;
      left: 17px;
      width: 38px;
      height: 18px;
      background: #19100b;
      border-radius: 18px 18px 8px 8px;
      transform: rotate(-5deg);
    }

    .eye {
      position: absolute;
      top: 13px;
      left: 25px;
      width: 5px;
      height: 5px;
      background: #142033;
      border-radius: 50%;
      box-shadow: 11px 0 #142033;
      animation: lookAtUser 7s ease-in-out infinite;
    }

    @keyframes lookAtUser {
      0%, 70%, 100% { transform: translateX(0); }
      78%, 90% { transform: translateX(3px) scale(1.15); }
    }

    .personBody {
      position: absolute;
      top: 38px;
      left: 13px;
      width: 44px;
      height: 48px;
      border-radius: 13px 13px 9px 9px;
      background: #0a0b0e;
      border: 1px solid rgba(255,255,255,.12);
    }

    .personBody::after {
      content: "LV";
      position: absolute;
      left: 0;
      right: 0;
      top: 11px;
      text-align: center;
      color: white;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .08em;
    }

    .arm, .leg {
      position: absolute;
      border-radius: 999px;
      transform-origin: top center;
    }

    .arm {
      top: 45px;
      width: 9px;
      height: 38px;
      background: #ffd5ae;
      animation: swingArm .6s ease-in-out infinite;
    }

    .arm.left { left: 6px; }
    .arm.right { right: 6px; animation-delay: -.3s; }

    @keyframes swingArm {
      0%,100% { transform: rotate(25deg); }
      50% { transform: rotate(-25deg); }
    }

    .leg {
      top: 84px;
      width: 10px;
      height: 43px;
      background: #050505;
      animation: swingLeg .6s ease-in-out infinite;
    }

    .leg.left { left: 20px; }
    .leg.right { right: 20px; animation-delay: -.3s; }

    @keyframes swingLeg {
      0%,100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    .worker.sitting .personBody { transform: translateY(14px); }
    .worker.sitting .personHead,
    .worker.sitting .hair { transform: translateY(12px); }
    .worker.sitting .arm { animation: none; transform: rotate(65deg); }
    .worker.sitting .leg { top: 103px; height: 26px; animation: none; transform: rotate(86deg); }

    .speech {
      position: absolute;
      left: 58px;
      top: -50px;
      width: min(360px, 72vw);
      padding: 10px 12px;
      border-radius: 15px 15px 15px 2px;
      background: rgba(255,255,255,.94);
      color: #142033;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.25;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(8px);
      animation: talk 12s ease-in-out infinite;
    }

    .worker.close .speech {
      opacity: 1;
      animation: none;
      top: -72px;
      left: 48px;
      font-size: 10px;
      width: 230px;
    }

    @keyframes talk {
      0%, 58%, 100% { opacity: 0; transform: translateY(8px); }
      66%, 92% { opacity: 1; transform: translateY(0); }
    }

    .prop {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .worker.carrying .prop {
      opacity: 1;
    }

    .prop.caseSmall {
      left: -28px;
      top: 72px;
      width: 38px;
      height: 28px;
      border-radius: 4px;
      background: #151515;
      border: 2px solid rgba(255,255,255,.4);
    }

    .prop.caseSmall::after {
      content: "KIT";
      position: absolute;
      inset: 8px 0 auto;
      text-align: center;
      font-size: 8px;
      font-weight: 950;
    }

    .prop.cameraSmall {
      left: -26px;
      top: 58px;
      width: 36px;
      height: 24px;
      border-radius: 5px;
      background: #121923;
      border: 1px solid rgba(255,255,255,.35);
    }

    .prop.cameraSmall::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 5px;
      width: 16px;
      height: 14px;
      border-radius: 7px 2px 2px 7px;
      background: #05070a;
    }

    .picnicKit {
      position: absolute;
      left: -54px;
      top: 94px;
      width: 160px;
      height: 70px;
      opacity: 0;
      transform: translateY(20px) scale(.8);
      transition: opacity .7s ease, transform .7s ease;
      pointer-events: none;
    }

  <script>
    const studio = document.getElementById('studio');
    const weatherBox = document.getElementById('weatherBox');
    const worker = document.getElementById('worker');
    const speech = document.getElementById('speech');
    const prop = document.getElementById('prop');
    const screenTitle = document.getElementById('screenTitle');
    const screenSub = document.getElementById('screenSub');
    const screenBadge = document.getElementById('screenBadge');
    const statusBoard = document.getElementById('statusBoard');
    const lightFlash = document.getElementById('lightFlash');

    const mainScreen = document.getElementById('mainScreen');
    const screenLogoSmall = document.getElementById('screenLogoSmall');
    const controlToast = document.getElementById('controlToast');
    const draggableCameras = document.querySelectorAll('.draggableCamera');
    const softboxes = document.querySelectorAll('.softbox');

    const fallback = {
      latitude: 52.2297,
      longitude: 21.0122,

    };

    const weatherText = {
      0: 'bezchmurnie', 1: 'pogodnie', 2: 'częściowe chmury', 3: 'pochmurno',

      80: 'przelotny deszcz', 81: 'przelotny deszcz', 82: 'ulewa',
      95: 'burza', 96: 'burza z gradem', 99: 'burza z gradem'
    };

    const screenSlides = [
      ['LINK VISUALS', 'PODCAST & VIDEO STUDIO', 'TWORZYMY HISTORIE, KTÓRE DZIAŁAJĄ'],
      ['PROMPTER READY', 'TEKST PŁYNIE, GOŚĆ MÓWI PEWNIE', 'MNIEJ STRESU NA PLANIE'],
      ['CAMERAS READY', 'SZEROKI KADR · PORTRET · SOCIAL', 'NAGRANIE GOTOWE DO DYSTRYBUCJI'],
      ['LIGHTS READY', 'KOLOR ŚCIAN ZMIENIANY ŚWIATŁEM', 'PREMIUM LOOK W KILKA SEKUND'],
      ['PODCAST STARTING', 'FOTELE · KANAPA · STÓŁ OKRĄGŁY', 'SETUP DOPASOWANY DO ROZMOWY'],
      ['LIVE IN 5 MIN', 'SPRAWDZAMY KAMERY I DŹWIĘK', 'LINK VISUALS ON AIR']
    ];

    const screenLogos = [
      ['LINK VISUALS', 'PODCAST & VIDEO STUDIO', 'PRODUKCJA LIVE · PODCASTY · WYWIADY', 'LINK VISUALS'],
      ['STUDIO DOBRYCH PRAKTYK', 'ROZMOWY · EDUKACJA · EKSPERCI', 'DOBRE TREŚCI W DOBRYM KADRZE', 'STUDIO DOBRYCH PRAKTYK'],
      ['ALAB LABORATORIA', 'WIEDZA · ZDROWIE · EKSPERCI', 'LIVE · WYWIAD · KONFERENCJA', 'ALAB'],
      ['HIPPO', 'PODCAST · VIDEO · SOCIAL', 'DUŻE POMYSŁY W MAŁYM STUDIU', 'HIPPO'],
      ['WYWIADY', 'PYTANIA · ODPOWIEDZI · HISTORIE', 'KAMERA GOTOWA DO ROZMOWY', 'INTERVIEW MODE'],
      ['PODCASTY', 'MIKROFONY · KAMERY · ŚWIATŁO', 'BRZMI DOBRZE I WYGLĄDA DOBRZE', 'PODCAST MODE'],
      ['LIVE', 'ON AIR · STREAM · REALIZACJA', 'NADAJEMY NA ŻYWO', 'LIVE MODE']
    ];

    let screenLogoIndex = 0;

    const boardTexts = [
      'PROMPTER READY<br>CAMERAS READY<br>LIGHTS READY',
      'MICS CHECKED<br>REC ARMED<br>PODCAST STARTING ♥',
      'SETUP: FOTELE<br>LIGHT: WARM RED<br>CLIENT: READY',
      'WIDE SHOT OK<br>CLOSE-UP OK<br>SOCIAL CUTS OK',
      'COFFEE READY<br>HOST READY<br>GUEST READY'
    ];

    const studioLines = [
      'Czy klient potrzebuje promptera?',
      'Ustawiam kamerę na ciasny portret.',
      'Sprawdzam szeroki kadr.',
      'Czy dziś robimy fotele, kanapę czy okrągły stół?',
      'Zmieniam kolor światła na bardziej brandowy.',
      'Przynoszę mikrofony. Bez nich podcast byłby pantomimą.',
      'Wynoszę case, bo w kadrze nie może robić kariery.',
      'Sprawdzam, czy ON AIR świeci jak trzeba.',
      'Czy gość patrzy w kamerę, czy do prowadzącego?',
      'Robimy też wersję pod LinkedIn i shorty?',
      'Światło gotowe. Teraz każdy wygląda jak ekspert.',
      'Prompter gotowy. Tekst już nie ucieknie.'
    ];

    const dadJokes = [
      'Dlaczego kamera nie kłamie? Bo ma obiektywne spojrzenie.',
      'Prompter nigdy nie zapomina tekstu. Najwyżej go przewinie.',
      'Mikrofon mówi do kamery: ty trzymaj kadr, ja trzymam poziom.',
      'Realizator nie śpi. Realizator renderuje rzeczywistość.',
      'Najlepszy setup? Taki, który nie skrzypi w połowie puenty.',
      'Kawa na planie nie stygnie. Ona tylko robi pauzę dramaturgiczną.',
      'Światło dobre, humor lepszy.',
      'Nie kręcę problemu. Kręcę ujęcie.',
      'Statyw stoi stabilnie, bo ma trzy argumenty.',
      'Ujęcie idealne nie zrobi się samo. Ale może trochę poczekać.',
      'Kiedy mikrofon milczy, to też zbiera ciszę premium.',
      'Kamera ma zoom, ale dystansu do siebie wciąż się uczy.',
      'Kanapa w studiu mówi: usiądź, ja zrobię klimat.'
    ];

    let lastWeatherPlace = fallback;
    let currentTask = false;
    let fullscreenHideTimer;

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function isRain(code) {
      return [51,53,55,61,63,65,80,81,82,95,96,99].includes(Number(code));
    }

    function updateDayNight() {
      const hour = new Date().getHours();
      studio.classList.toggle('night', hour < 6 || hour >= 20);
      return hour < 6 || hour >= 20;
    }

    function say(text) {
      speech.textContent = text;
    }

    function clearWorkerModes() {
      worker.classList.remove('close', 'picnic', 'sitting', 'coffeeBreak', 'sofaRest', 'adjustCamera', 'adjustLight', 'carryCase', 'carrying');
      prop.className = 'prop caseSmall';
    }

    function applyWeather(data, label) {
      const current = data.current || {};
      const code = current.weather_code;
      const raining = isRain(code);
      const night = updateDayNight();

      studio.classList.toggle('rainy', raining);

      const temp = Math.round(current.temperature_2m ?? 0);
      const desc = weatherText[code] || 'pogoda';

      weatherBox.innerHTML =
        `${raining ? '🌧️' : night ? '🌙' : '☀️'} ${temp}°C<br>` +
        `${label}<br>` +
        `${night ? 'Noc' : 'Dzień'} · ${desc}`;

      if (raining) say('Pada, ale studio działa. Parasol LINK VISUALS otwarty.');
      else if (night) say('Nocna zmiana. Pilnuję świateł i kamer.');
    }

    async function fetchWeather(place = fallback) {
      lastWeatherPlace = place;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Błąd pogody');
        const data = await response.json();
        applyWeather(data, place.label);
      } catch (error) {
        updateDayNight();
        studio.classList.remove('rainy');
        weatherBox.innerHTML = 'LINK VISUALS<br>tryb offline<br>24/7';
      }
    }

    function tryBrowserLocation() {
      if (!navigator.geolocation) {
        fetchWeather(fallback);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          fetchWeather({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            label: 'Twoja lokalizacja'
          });
        },
        () => fetchWeather(fallback),
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 20 * 60 * 1000 }
      );
    }

    function setScreenRandom() {
      const slide = randomFrom(screenSlides);
      screenTitle.textContent = slide[0];
      screenSub.textContent = slide[1];
      screenBadge.textContent = slide[2];
      screenLogoSmall.textContent = slide[0];
      statusBoard.innerHTML = randomFrom(boardTexts);
    }

    function nextScreenLogo() {
      screenLogoIndex = (screenLogoIndex + 1) % screenLogos.length;
      const slide = screenLogos[screenLogoIndex];
      screenTitle.textContent = slide[0];
      screenSub.textContent = slide[1];
      screenBadge.textContent = slide[2];
      screenLogoSmall.textContent = slide[3];
      say('Ekran zmieniony: ' + slide[0] + '.');
      showControlToast('Ekran: ' + slide[0]);
    }

    function showControlToast(text) {
      controlToast.textContent = text;
      controlToast.classList.add('show');
      clearTimeout(showControlToast.timer);
      showControlToast.timer = setTimeout(() => {
        controlToast.classList.remove('show');
      }, 2200);
    }

    function flashLight() {
      lightFlash.classList.add('show');
      setTimeout(() => lightFlash.classList.remove('show'), 700);
    }

    function startCoffeeBreak() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('coffeeBreak');
      say('Przerwa przy czarnym stoliku. Kawa to nie napój — to dramaturgia w kubku ☕');
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom([...studioLines, ...dadJokes]));
      }, 13000);
    }

    function restOnSofa() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('sofaRest');
      say('Na chwilę spocznę na kanapie. Najlepsze pomysły przychodzą, kiedy udajesz, że odpoczywasz.');
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom([...studioLines, ...dadJokes]));
      }, 11000);
    }

    function adjustCamera() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('adjustCamera');
      say('Ustawiam kamerę. Trochę w lewo, trochę w prawo i nagle jest premium.');
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom(studioLines));
      }, 9000);
    }

    function adjustLight() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('adjustLight');
      say('Reguluję światło. Ściana właśnie dostała nowy charakter.');
      flashLight();
      setTimeout(flashLight, 2400);
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom(studioLines));
      }, 9000);
    }

    function carryGear() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('carryCase', 'carrying');
      prop.className = Math.random() > .5 ? 'prop caseSmall' : 'prop cameraSmall';
      say('Przynoszę sprzęt. Case sam się nie wniesie, chociaż bardzo by chciał.');
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom(studioLines));
      }, 12000);
    }

    function comeCloser() {
      if (currentTask) return;
      currentTask = true;
      clearWorkerModes();
      worker.classList.add('close');
      say(randomFrom([...studioLines, ...dadJokes]));
      setTimeout(() => {
        clearWorkerModes();
        currentTask = false;
        say(randomFrom(studioLines));
      }, 6500);
    }

    function randomTask() {
      const tasks = [startCoffeeBreak, restOnSofa, adjustCamera, adjustLight, carryGear];
      randomFrom(tasks)();
    }

    function showFullscreenButton() {
      fullscreenBtn.classList.remove('hidden');
      clearTimeout(fullscreenHideTimer);
      fullscreenHideTimer = setTimeout(() => {
        fullscreenBtn.classList.add('hidden');
      }, 10000);
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = '⛶ Wyjdź';
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = '⛶ Fullscreen';
        }
      } catch (error) {
        say('Przeglądarka nie pozwoliła włączyć fullscreen.');
      }
      showFullscreenButton();
    }


    function toggleStudioLights() {
      studio.classList.toggle('lightsOff');
      const off = studio.classList.contains('lightsOff');
      say(off ? 'Zgasiłem część świateł. Klimat: nocny wywiad premium.' : 'Światła wróciły. Teraz każdy wygląda jak ekspert.');
      showControlToast(off ? 'Światła zgaszone' : 'Światła włączone');
      if (!off) flashLight();
    }

    softboxes.forEach(box => {
      box.addEventListener('pointerdown', event => {
        event.stopPropagation();
        toggleStudioLights();
      });
    });

    mainScreen.addEventListener('pointerdown', event => {
      event.stopPropagation();
      nextScreenLogo();
    });

    draggableCameras.forEach(camera => {
      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      camera.addEventListener('pointerdown', event => {
        event.stopPropagation();
        dragging = true;
        camera.classList.add('dragging');
        camera.setPointerCapture(event.pointerId);

        const rect = camera.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        camera.style.left = rect.left + 'px';
        camera.style.top = rect.top + 'px';
        camera.style.right = 'auto';
        camera.style.bottom = 'auto';
        camera.style.transform = camera.classList.contains('left') ? 'scale(1.25)' : 'scale(1)';
        showControlToast('Przeciągasz kamerę');
      });

      camera.addEventListener('pointermove', event => {
        if (!dragging) return;
        const x = Math.max(-40, Math.min(window.innerWidth - 60, event.clientX - offsetX));
        const y = Math.max(40, Math.min(window.innerHeight - 90, event.clientY - offsetY));
        camera.style.left = x + 'px';
        camera.style.top = y + 'px';
      });

      function stopDrag(event) {
        if (!dragging) return;
        dragging = false;
        camera.classList.remove('dragging');
        try { camera.releasePointerCapture(event.pointerId); } catch(e) {}
        say('Kamera przestawiona. Kadr sam się nie zrobi, ale już jest bliżej.');
        showControlToast('Kamera ustawiona');
      }

      camera.addEventListener('pointerup', stopDrag);
      camera.addEventListener('pointercancel', stopDrag);
    });

    fullscreenBtn.addEventListener('pointerdown', event => event.stopPropagation());
    fullscreenBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent = document.fullscreenElement ? '⛶ Wyjdź' : '⛶ Fullscreen';
      showFullscreenButton();
    });

    ['pointermove', 'pointerdown', 'keydown'].forEach(eventName => {
      window.addEventListener(eventName, showFullscreenButton, { passive: true });
    });

    studio.addEventListener('pointerdown', () => {
      comeCloser();
    });

    updateDayNight();
    tryBrowserLocation();
    showFullscreenButton();
    setScreenRandom();

    setInterval(updateDayNight, 60 * 1000);
    setInterval(() => fetchWeather(lastWeatherPlace), 10 * 60 * 1000);
    setInterval(setScreenRandom, 18000);

    setInterval(() => {
      if (!currentTask) {
        const mostlyJokes = Math.random() > 0.35 ? dadJokes : studioLines;
        say(randomFrom(mostlyJokes));
      }
    }, 6500);

    setInterval(() => {
      if (Math.random() > .32) randomTask();
    }, 16000);
  </script>
</body>
</html>
