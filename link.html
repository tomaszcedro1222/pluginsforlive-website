<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINK VISUALS — Life Window</title>
  <meta name="description" content="Animowana strona LINK VISUALS z ludkiem reagującym na pogodę i porę dnia." />
  <style>
    :root {
      --sky-day-1: #84d9ff;
      --sky-day-2: #eefaff;
      --sky-night-1: #061120;
      --sky-night-2: #132b4d;
      --ground: #16202b;
      --building: #18283b;
      --building-2: #263d59;
      --rain: rgba(210,235,255,.75);
      --sun: #ffd45a;
      --wall-light: rgba(255,255,255,.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #06111f;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
      background:
        radial-gradient(circle at 80% 16%, rgba(255,255,255,.42), transparent 7rem),
        linear-gradient(var(--sky-day-1), var(--sky-day-2) 58%, #a9ccb0 58%, #5a7b62 100%);
      transition: background 1.2s ease;
    }

    .scene.night {
      background:
        radial-gradient(circle at 78% 14%, rgba(255,255,255,.95), rgba(255,255,255,.4) 2.2rem, transparent 2.4rem),
        linear-gradient(var(--sky-night-1), var(--sky-night-2) 60%, #17212c 60%, #0f171e 100%);
    }

    .scene.rainy::before {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(110deg, transparent 0 22px, var(--rain) 23px 25px, transparent 26px 36px);
      animation: rainFall .45s linear infinite;
      opacity: .72;
      z-index: 40;
    }

    .scene.rainy::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 42%;
      background: linear-gradient(transparent, rgba(80,130,160,.18));
      pointer-events: none;
      z-index: 38;
    }

    @keyframes rainFall {
      from { transform: translate3d(-40px,-40px,0); }
      to { transform: translate3d(40px,40px,0); }
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #fff 0 1px, transparent 1.5px);
      background-size: 180px 140px, 260px 210px, 340px 260px;
      background-position: 30px 20px, 120px 80px, 70px 160px;
    }

    .night .stars { opacity: .9; }

    .sunMoon {
      position: absolute;
      right: 10vw;
      top: 9vh;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 45px rgba(255,212,90,.75);
      transition: background 1s ease, box-shadow 1s ease;
      z-index: 2;
    }

    .night .sunMoon {
      background: #f4f1da;
      box-shadow: 0 0 24px rgba(255,255,255,.35);
    }

    .cloud {
      position: absolute;
      top: 13vh;
      left: -22vw;
      width: 180px;
      height: 52px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      filter: drop-shadow(0 9px 14px rgba(0,0,0,.12));
      animation: cloudMove 55s linear infinite;
      z-index: 4;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 82px;
      height: 82px;
      left: 28px;
      top: -38px;
    }

    .cloud::after {
      width: 104px;
      height: 104px;
      right: 20px;
      top: -55px;
    }

    .cloud.two {
      top: 24vh;
      animation-duration: 78s;
      animation-delay: -18s;
      transform: scale(.75);
      opacity: .8;
    }

    @keyframes cloudMove {
      from { left: -24vw; }
      to { left: 124vw; }
    }

    .hud {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 90;
      min-width: 175px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(8,18,31,.58);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.14);
      pointer-events: none;
    }

    .logo {
      font-size: 19px;
      font-weight: 950;
      letter-spacing: .18em;
      margin-bottom: 7px;
    }

    .weather {
      font-size: 14px;
      line-height: 1.45;
      opacity: .95;
    }

    .backdrop {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 21vh;
      height: 32vh;
      z-index: 8;
      opacity: .72;
      overflow: hidden;
      pointer-events: none;
    }

    .set {
      position: absolute;
      bottom: 0;
      width: 44vw;
      min-width: 420px;
      height: 100%;
      border-radius: 24px 24px 0 0;
      background:
        radial-gradient(circle at 30% 36%, var(--wall-light), transparent 18%),
        radial-gradient(circle at 70% 30%, var(--wall-light), transparent 18%),
        linear-gradient(145deg, rgba(16,28,43,.9), rgba(38,55,77,.82));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
      animation: setMove 48s linear infinite;
    }

    .set:nth-child(2) { animation-delay: -16s; }
    .set:nth-child(3) { animation-delay: -32s; }

    .set::before {
      content: attr(data-name);
      position: absolute;
      left: 22px;
      top: 18px;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: .14em;
      opacity: .24;
    }

    .set.sofa::after {
      content: "";
      position: absolute;
      left: 12%;
      bottom: 12%;
      width: 50%;
      height: 28%;
      border-radius: 26px 26px 12px 12px;
      background: rgba(255,255,255,.25);
      box-shadow: 26vw 5vh 0 -3vh rgba(255,255,255,.18);
    }

    .set.chairs::after {
      content: "";
      position: absolute;
      left: 16%;
      bottom: 10%;
      width: 70%;
      height: 46%;
      background:
        radial-gradient(circle at 24% 62%, rgba(255,255,255,.3) 0 11%, transparent 12%),
        radial-gradient(circle at 76% 62%, rgba(255,255,255,.3) 0 11%, transparent 12%),
        linear-gradient(transparent 0 58%, rgba(255,255,255,.18) 59% 65%, transparent 66%);
    }

    .set.table::after {
      content: "";
      position: absolute;
      left: 33%;
      bottom: 14%;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(255,255,255,.26);
      box-shadow: 0 8vh 0 -6.5vh rgba(255,255,255,.4);
    }

    @keyframes setMove {
      from { transform: translateX(112vw); }
      to { transform: translateX(-62vw); }
    }

    .cityTrack {
      position: absolute;
      left: 0;
      bottom: 17vh;
      height: 42vh;
      width: max-content;
      display: flex;
      align-items: end;
      gap: clamp(12px, 2vw, 30px);
      z-index: 14;
      animation: citySlide 72s linear infinite;
    }

    @keyframes citySlide {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .cityGroup {
      display: flex;
      align-items: end;
      gap: clamp(12px, 2vw, 30px);
      padding-left: 5vw;
      padding-right: 5vw;
    }

    .building {
      position: relative;
      width: min(8vw, 92px);
      min-width: 52px;
      height: calc(130px + var(--h) * 1px);
      border-radius: 10px 10px 0 0;
      background: linear-gradient(145deg, var(--building), var(--building-2));
      box-shadow: 0 24px 40px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
    }

    .building .letter {
      font-size: clamp(26px, 5vw, 54px);
      font-weight: 900;
      letter-spacing: -2px;
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,.35);
      z-index: 2;
    }

    .building::before {
      content: "";
      position: absolute;
      left: 13%;
      right: 13%;
      top: 18px;
      bottom: 18px;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0 20px,
          rgba(255,227,138,.72) 21px 31px,
          transparent 32px 45px);
      opacity: .35;
      border-radius: 6px;
    }

    .roofFlag {
      position: absolute;
      top: -46px;
      left: 50%;
      width: 2px;
      height: 46px;
      background: white;
      opacity: .6;
    }

    .roofFlag::after {
      content: "LV";
      position: absolute;
      top: 3px;
      left: 2px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,.9);
      color: #142033;
      border-radius: 0 8px 8px 0;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20vh;
      background:
        linear-gradient(rgba(255,255,255,.08), transparent 12%),
        repeating-linear-gradient(90deg, transparent 0 70px, rgba(255,255,255,.07) 71px 74px),
        var(--ground);
      z-index: 18;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      top: 22%;
      height: 42%;
      background: rgba(0,0,0,.25);
      border-top: 2px solid rgba(255,255,255,.15);
      border-bottom: 2px solid rgba(255,255,255,.15);
    }

    .road::after {
      content: "LINK VISUALS • PODCAST • STREAM • STUDIO • PROMPTER • LIGHTING • SETUP •";
      position: absolute;
      left: 0;
      right: 0;
      top: 35%;
      font-size: clamp(16px, 2.6vw, 32px);
      font-weight: 900;
      letter-spacing: .25em;
      white-space: nowrap;
      opacity: .18;
      animation: brandScroll 26s linear infinite;
    }

    @keyframes brandScroll {
      from { transform: translateX(0); }
      to { transform: translateX(-620px); }
    }

    .walker {
      position: absolute;
      left: 0;
      bottom: 17vh;
      width: 68px;
      height: 118px;
      transform-origin: 50% 100%;
      z-index: 30;
      animation: travel 34s linear infinite, bob .6s ease-in-out infinite;
      transition: left .8s ease, bottom .8s ease, transform .8s ease;
    }

    .walker.comeClose {
      animation: none;
      left: calc(50vw - 34px);
      bottom: 11vh;
      transform: scale(2.25);
      z-index: 80;
    }

    .walker.picnic {
      animation: picnicPos 16s ease-in-out forwards, bob 1.1s ease-in-out infinite;
    }

    @keyframes travel {
      0%   { transform: translateX(-90px) translateY(0) scaleX(1); }
      16%  { transform: translateX(18vw) translateY(0) scaleX(1); }
      22%  { transform: translateX(25vw) translateY(-210px) scaleX(1); }
      28%  { transform: translateX(33vw) translateY(-210px) scaleX(1); }
      34%  { transform: translateX(42vw) translateY(0) scaleX(1); }
      54%  { transform: translateX(72vw) translateY(0) scaleX(1); }
      61%  { transform: translateX(79vw) translateY(-250px) scaleX(1); }
      68%  { transform: translateX(86vw) translateY(-250px) scaleX(1); }
      76%  { transform: translateX(97vw) translateY(0) scaleX(1); }
      84%  { transform: translateX(103vw) translateY(0) scaleX(-1); }
      100% { transform: translateX(-90px) translateY(0) scaleX(1); }
    }

    @keyframes picnicPos {
      from { left: 0; transform: translateX(0); }
      to { left: 50vw; transform: translateX(-50%) translateY(0); }
    }

    @keyframes bob {
      0%,100% { margin-bottom: 0; }
      50% { margin-bottom: 5px; }
    }

    .head {
      position: absolute;
      top: 0;
      left: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffd5ae;
      box-shadow: inset -7px -4px rgba(0,0,0,.08);
    }

    .hair {
      position: absolute;
      top: -4px;
      left: 17px;
      width: 36px;
      height: 18px;
      background: #25180e;
      border-radius: 18px 18px 8px 8px;
      transform: rotate(-5deg);
    }

    .eye {
      position: absolute;
      top: 13px;
      left: 25px;
      width: 5px;
      height: 5px;
      background: #142033;
      border-radius: 50%;
      box-shadow: 11px 0 #142033;
      animation: lookAtUser 7s ease-in-out infinite;
    }

    @keyframes lookAtUser {
      0%, 70%, 100% { transform: translateX(0); }
      78%, 90% { transform: translateX(3px) scale(1.15); }
    }

    .body {
      position: absolute;
      top: 38px;
      left: 18px;
      width: 34px;
      height: 42px;
      background: #f4f8ff;
      border-radius: 12px 12px 8px 8px;
      box-shadow: inset 0 -12px rgba(20,32,51,.12);
    }

    .body::after {
      content: "LV";
      position: absolute;
      inset: 8px 0 auto;
      text-align: center;
      color: #142033;
      font-size: 12px;
      font-weight: 900;
    }

    .arm, .leg {
      position: absolute;
      background: #ffd5ae;
      border-radius: 999px;
      transform-origin: top center;
    }

    .arm {
      top: 43px;
      width: 9px;
      height: 35px;
      animation: swingArm .6s ease-in-out infinite;
    }

    .arm.left { left: 9px; }
    .arm.right { right: 9px; animation-delay: -.3s; }

    @keyframes swingArm {
      0%,100% { transform: rotate(25deg); }
      50% { transform: rotate(-25deg); }
    }

    .leg {
      top: 78px;
      width: 10px;
      height: 41px;
      background: #111827;
      animation: swingLeg .6s ease-in-out infinite;
    }

    .leg.left { left: 21px; }
    .leg.right { right: 21px; animation-delay: -.3s; }

    .walker.sitting .body { transform: translateY(14px); }
    .walker.sitting .head, .walker.sitting .hair { transform: translateY(12px); }
    .walker.sitting .arm { animation: none; transform: rotate(65deg); }
    .walker.sitting .leg { top: 99px; height: 26px; animation: none; transform: rotate(86deg); }

    @keyframes swingLeg {
      0%,100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    .umbrella {
      position: absolute;
      left: -13px;
      top: -44px;
      width: 94px;
      height: 50px;
      opacity: 0;
      transform: scale(.8);
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: none;
    }

    .rainy .umbrella {
      opacity: 1;
      transform: scale(1);
    }

    .umbrella::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 90px 90px 8px 8px;
      background:
        repeating-conic-gradient(from 0deg, #f04f63 0 25deg, #ffffff 25deg 50deg);
      clip-path: polygon(0 100%, 10% 35%, 50% 0, 90% 35%, 100% 100%);
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
    }

    .umbrella::after {
      content: "";
      position: absolute;
      left: 47px;
      top: 38px;
      width: 3px;
      height: 54px;
      background: #2a3342;
      border-radius: 999px;
    }

    .picnicKit {
      position: absolute;
      left: -54px;
      top: 91px;
      width: 160px;
      height: 70px;
      opacity: 0;
      transform: translateY(20px) scale(.8);
      transition: opacity .7s ease, transform .7s ease;
      pointer-events: none;
    }

    .walker.sitting .picnicKit {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .blanket {
      position: absolute;
      inset: 30px 0 0;
      border-radius: 40% 45% 36% 38%;
      background:
        linear-gradient(90deg, rgba(255,255,255,.28) 0 20%, transparent 20% 40%, rgba(255,255,255,.28) 40% 60%, transparent 60% 80%, rgba(255,255,255,.28) 80%),
        #d84d58;
      box-shadow: 0 8px 14px rgba(0,0,0,.2);
    }

    .coffee {
      position: absolute;
      left: 105px;
      top: 8px;
      width: 26px;
      height: 31px;
      border-radius: 0 0 9px 9px;
      background: #fff;
    }

    .coffee::before {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 6px;
      height: 7px;
      border-radius: 50%;
      background: #6b3d21;
    }

    .coffee::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 9px;
      width: 11px;
      height: 13px;
      border: 3px solid #fff;
      border-left: 0;
      border-radius: 0 12px 12px 0;
    }

    .speech {
      position: absolute;
      left: 55px;
      top: -44px;
      width: min(360px, 72vw);
      padding: 10px 12px;
      border-radius: 15px 15px 15px 2px;
      background: rgba(255,255,255,.94);
      color: #142033;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(8px);
      animation: talk 12s ease-in-out infinite;
    }

    .walker.comeClose .speech {
      opacity: 1;
      animation: none;
      top: -72px;
      left: 48px;
      font-size: 10px;
      width: 220px;
    }

    @keyframes talk {
      0%, 58%, 100% { opacity: 0; transform: translateY(8px); }
      66%, 92% { opacity: 1; transform: translateY(0); }
    }

    .marquee {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 3;
      white-space: nowrap;
      font-size: clamp(60px, 15vw, 210px);
      font-weight: 950;
      letter-spacing: .12em;
      color: rgba(255,255,255,.08);
      animation: bigBrand 70s linear infinite;
      pointer-events: none;
    }

    @keyframes bigBrand {
      from { transform: translateX(100vw); }
      to { transform: translateX(-220vw); }
    }


    .fullscreenBtn {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,.18);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(8,18,31,.62);
      color: white;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .04em;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,.24);
      cursor: pointer;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .45s ease, transform .45s ease, background .25s ease;
    }

    .fullscreenBtn:hover {
      background: rgba(8,18,31,.82);
    }

    .fullscreenBtn.hidden {
      opacity: 0;
      transform: translateY(-16px);
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .building { min-width: 34px; border-radius: 7px 7px 0 0; }
      .building .letter { font-size: 28px; }
      .hud { left: 10px; top: 10px; padding: 10px 12px; }
      .logo { font-size: 16px; }
      .weather { font-size: 12px; }
      .walker.comeClose { transform: scale(1.8); bottom: 14vh; }
      .set { min-width: 330px; }
      .fullscreenBtn {
        right: 10px;
        top: 10px;
        padding: 9px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main id="scene" class="scene">
    <div class="stars"></div>
    <div class="sunMoon" aria-hidden="true"></div>
    <div class="cloud"></div>
    <div class="cloud two"></div>
    <div class="marquee">LINK VISUALS • PODCAST STUDIO • LIVE PRODUCTION •</div>

    <section class="hud">
      <div class="logo">LINK VISUALS</div>
      <div id="weatherBox" class="weather">Pobieram pogodę…</div>
    </section>

    <button id="fullscreenBtn" class="fullscreenBtn" type="button">⛶ Fullscreen</button>

    <section class="backdrop" aria-hidden="true">
      <div class="set sofa" data-name="KANAPA"></div>
      <div class="set chairs" data-name="FOTELE"></div>
      <div class="set table" data-name="STÓŁ OKRĄGŁY"></div>
    </section>

    <section class="cityTrack" aria-label="Przesuwające się budynki LINK VISUALS">
      <div class="cityGroup" id="cityA"></div>
      <div class="cityGroup" id="cityB"></div>
    </section>

    <div id="walker" class="walker" aria-label="Ludek LINK VISUALS">
      <div class="umbrella"></div>
      <div class="speech" id="speech">LINK VISUALS działa 24/7 👀</div>
      <div class="picnicKit">
        <div class="coffee"></div>
        <div class="blanket"></div>
      </div>
      <div class="hair"></div>
      <div class="head"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div class="ground">
      <div class="road"></div>
    </div>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const weatherBox = document.getElementById('weatherBox');
    const speech = document.getElementById('speech');
    const walker = document.getElementById('walker');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    const fallback = {
      latitude: 52.2297,
      longitude: 21.0122,
      label: 'Warszawa'
    };

    const letters = 'LINKVISUALS'.split('');
    const heights = [70,140,95,180,125,165,85,145,105,155,115];

    function createCity(group) {
      group.innerHTML = '';
      letters.forEach((letter, i) => {
        const b = document.createElement('div');
        b.className = 'building';
        b.style.setProperty('--h', heights[i]);
        if (i === 0 || i === 4 || i === 8) {
          const flag = document.createElement('span');
          flag.className = 'roofFlag';
          b.appendChild(flag);
        }
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = letter;
        b.appendChild(span);
        group.appendChild(b);
      });
    }

    createCity(document.getElementById('cityA'));
    createCity(document.getElementById('cityB'));

    const weatherText = {
      0: 'bezchmurnie', 1: 'pogodnie', 2: 'częściowe chmury', 3: 'pochmurno',
      45: 'mgła', 48: 'mgła',
      51: 'mżawka', 53: 'mżawka', 55: 'mocna mżawka',
      56: 'marznąca mżawka', 57: 'marznąca mżawka',
      61: 'lekki deszcz', 63: 'deszcz', 65: 'mocny deszcz',
      66: 'marznący deszcz', 67: 'marznący deszcz',
      71: 'lekki śnieg', 73: 'śnieg', 75: 'mocny śnieg', 77: 'śnieg',
      80: 'przelotny deszcz', 81: 'przelotny deszcz', 82: 'ulewa',
      85: 'przelotny śnieg', 86: 'śnieg',
      95: 'burza', 96: 'burza z gradem', 99: 'burza z gradem'
    };

    const studioQuestions = [
      'Ile osób będzie przy stole?',
      'Czy robimy fotele, kanapę czy okrągły stół?',
      'Czy klient potrzebuje promptera?',
      'Jaki kolor światła dziś ustawiamy?',
      'Czy nagrywamy też shorty i rolki?',
      'Czy gość patrzy w kamerę czy do prowadzącego?',
      'Czy klimat ma być premium, chillout czy newsroom?',
      'Czy potrzebny jest szeroki kadr?',
      'Czy klient chce wersję na LinkedIn?',
      'Czy robimy światło ciepłe, zimne czy brandowe?'
    ];

    const offers = [
      'Może prompter? Gość mówi pewniej, a montaż mniej cierpi.',
      'Zmiana koloru ścian światłem i studio wygląda jak nowe.',
      'Fotele są premium. Kanapa jest luźna. Okrągły stół robi panel.',
      'LINK VISUALS: kamera, światło, prompter i spokój na planie.',
      'Dzisiaj ustawiam światło tak, żeby nawet mikrofon wyglądał drogo.'
    ];

    const dadJokes = [
      'Dlaczego kamera nie kłamie? Bo ma obiektywne spojrzenie.',
      'Prompter nigdy nie zapomina tekstu. Najwyżej go przewinie.',
      'Mikrofon mówi do kamery: ty trzymaj kadr, ja trzymam poziom.',
      'Realizator nie śpi. Realizator renderuje rzeczywistość.',
      'Najlepszy setup? Taki, który nie skrzypi w połowie puenty.'
    ];

    let lastWeatherPlace = fallback;

    function isRain(code) {
      return [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(Number(code));
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateDayNight() {
      const hour = new Date().getHours();
      const night = hour < 6 || hour >= 20;
      scene.classList.toggle('night', night);
      return night;
    }

    function say(text) {
      speech.textContent = text;
    }

    function applyWeather(data, label) {
      const current = data.current || {};
      const code = current.weather_code;
      const raining = isRain(code);
      const night = updateDayNight();

      scene.classList.toggle('rainy', raining);

      const temp = Math.round(current.temperature_2m ?? 0);
      const desc = weatherText[code] || 'pogoda';

      weatherBox.innerHTML =
        `${raining ? '🌧️' : night ? '🌙' : '☀️'} ${temp}°C<br>` +
        `${label}<br>` +
        `${night ? 'Noc' : 'Dzień'} · ${desc}`;

      if (raining) say('Pada, więc parasol LINK VISUALS otwarty ☔');
      else if (night) say('Nocna zmiana. Pilnuję studia LINK VISUALS 🌙');
      else say(randomFrom(studioQuestions));
    }

    async function fetchWeather(place = fallback) {
      lastWeatherPlace = place;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Błąd pogody');
        const data = await response.json();
        applyWeather(data, place.label);
      } catch (error) {
        updateDayNight();
        scene.classList.remove('rainy');
        weatherBox.innerHTML = `LINK VISUALS<br>tryb offline<br>24/7`;
        say('Tryb offline, ale ludek dalej pilnuje LINK VISUALS.');
      }
    }

    function tryBrowserLocation() {
      if (!navigator.geolocation) {
        fetchWeather(fallback);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          fetchWeather({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            label: 'Twoja lokalizacja'
          });
        },
        () => fetchWeather(fallback),
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 20 * 60 * 1000 }
      );
    }

    function startPicnic() {
      if (walker.classList.contains('comeClose') || walker.classList.contains('sitting')) return;

      walker.classList.add('picnic', 'sitting');
      say('Przerwa: kocyk, kawka i planowanie setupu ☕');
      setTimeout(() => {
        walker.classList.remove('picnic', 'sitting');
        say(randomFrom(studioQuestions));
      }, 12000);
    }

    function changeStudioLight() {
      const colors = [
        'rgba(255,255,255,.16)',
        'rgba(255,180,120,.22)',
        'rgba(120,190,255,.22)',
        'rgba(190,120,255,.22)',
        'rgba(255,120,160,.22)',
        'rgba(120,255,205,.20)'
      ];
      document.documentElement.style.setProperty('--wall-light', randomFrom(colors));
      say('Zmieniłem kolor ścian światłem. Studio ma nowy klimat.');
    }

    function comeCloser() {
      if (walker.classList.contains('sitting')) return;

      walker.classList.add('comeClose');
      say(randomFrom([...studioQuestions, ...offers, ...dadJokes]));
      setTimeout(() => {
        walker.classList.remove('comeClose');
        say(randomFrom(studioQuestions));
      }, 6500);
    }


    let fullscreenHideTimer;

    function showFullscreenButton() {
      fullscreenBtn.classList.remove('hidden');
      clearTimeout(fullscreenHideTimer);
      fullscreenHideTimer = setTimeout(() => {
        fullscreenBtn.classList.add('hidden');
      }, 10000);
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = '⛶ Wyjdź';
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = '⛶ Fullscreen';
        }
      } catch (error) {
        say('Przeglądarka nie pozwoliła włączyć fullscreen.');
      }
      showFullscreenButton();
    }

    fullscreenBtn.addEventListener('pointerdown', (event) => {
      event.stopPropagation();
    });

    fullscreenBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent = document.fullscreenElement ? '⛶ Wyjdź' : '⛶ Fullscreen';
      showFullscreenButton();
    });

    ['pointermove', 'pointerdown', 'keydown'].forEach(eventName => {
      window.addEventListener(eventName, showFullscreenButton, { passive: true });
    });

    scene.addEventListener('pointerdown', () => {
      comeCloser();
    });

    updateDayNight();
    tryBrowserLocation();
    showFullscreenButton();

    setInterval(updateDayNight, 60 * 1000);
    setInterval(() => fetchWeather(lastWeatherPlace), 10 * 60 * 1000);

    setInterval(() => {
      if (walker.classList.contains('comeClose') || walker.classList.contains('sitting')) return;
      const pool = [
        ...studioQuestions,
        ...offers,
        ...dadJokes,
        scene.classList.contains('rainy')
          ? 'Pada, więc parasol otwarty. Podcast nagrywamy dalej.'
          : 'Idę sprawdzić, czy prompter jest gotowy.'
      ];
      say(randomFrom(pool));
    }, 9500);

    setInterval(() => {
      if (Math.random() > .45) startPicnic();
    }, 36000);

    setInterval(() => {
      if (Math.random() > .52) changeStudioLight();
    }, 24000);
  </script>
</body>
</html>
